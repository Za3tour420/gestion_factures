<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Invoice Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
      <h1>🧾 Agent Factures</h1>
        
      <div id="chatArea" class="chat-area"></div>
    </div>

        <form id="chatForm" method="POST" enctype="multipart/form-data" class="chat-input">
            <textarea id="query" name="query" placeholder="Posez votre question..." required></textarea><br />
            <input id="pdf" type="file" name="pdf" accept=".pdf, .jpg, .jpeg, .png, .webp" multiple/><br />
            <button type="submit">Analyser</button>
        </form>


    <script>
    const chatArea = document.getElementById("chatArea");

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    document.getElementById("chatForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const form = new FormData();
      const query = document.getElementById("query").value;
      form.append("query", query);

      const fileInput = document.getElementById("pdf");
      if (fileInput.files.length > 0) {
          form.append("pdf", fileInput.files[0]);
      }
      
      // Clear inputs
      document.getElementById("query").value = "";
      document.getElementById("pdf").value = "";
      
      const div = document.createElement("div");
      div.className = `user`;
      div.innerHTML = `<strong>User:</strong><div>${marked.parse(query)}</div>`;
      chatArea.appendChild(div);

      const response = await fetch("/chat", {
          method: "POST",
          body: form,
      });

      if (!response.ok) {
          alert("Erreur côté serveur.");
          return;
      }

      const data = await response.json();
      const newMessages = data.history.slice(-1) // Last message (AIMessage)

      newMessages.forEach(msg => {
          const div = document.createElement("div");
          div.className = `message ${msg.role}`;
          div.innerHTML = `<strong>${msg.role.charAt(0).toUpperCase() + msg.role.slice(1)}:</strong><div>${marked.parse(msg.content)}</div>`;
          chatArea.appendChild(div);
      });

      
      scrollToBottom();
    });
