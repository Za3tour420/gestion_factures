<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Facture Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
      <h1>🧾 Facture Analysis Chatbot</h1>
        
      <div id="chatArea" class="chat-area"></div>
    </div>

        <form id="chatForm" enctype="multipart/form-data" class="chat-input">
            <textarea id="query" name="query" placeholder="Posez votre question..." required></textarea><br />
            <input id="pdf" type="file" name="pdf" accept=".pdf" /><br />
            <button type="submit">Analyser</button>
        </form>


    <script>
    const chatArea = document.getElementById("chatArea");

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    document.getElementById("chatForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const form = new FormData();
        const query = document.getElementById("query").value;
        form.append("query", query);

        const fileInput = document.getElementById("pdf");
        if (fileInput.files.length > 0) {
            form.append("pdf", fileInput.files[0]);
        }
        
        // Clear inputs
        document.getElementById("query").value = "";
        document.getElementById("pdf").value = "";

        const response = await fetch("/chat", {
            method: "POST",
            body: form,
        });

        if (!response.ok) {
            alert("Erreur côté serveur.");
            return;
        }

        const data = await response.json();
        const chatArea = document.getElementById("chatArea");
        chatArea.innerHTML = ""; // Clear previous chat

        data.history.forEach(msg => {
            const div = document.createElement("div");
            div.className = `message ${msg.role}`;
            div.innerHTML = `<strong>${msg.role.charAt(0).toUpperCase() + msg.role.slice(1)}:</strong><p>${msg.content}</p>`;
            chatArea.appendChild(div);
        });
        
        scrollToBottom();
    });
    </script>
</body>
</html>
